[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dockfleet"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sqlmodel",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.3",
    "pydantic",
    "pyyaml",
    "typer",
    "requests",
    "httpx",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
dockfleet = "dockfleet.cli.main:app"

[tool.setuptools]
packages = ["dockfleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 150
extend-ignore = ["F841", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
